name: Build Release AAB

on:
  workflow_dispatch:
    inputs:
      routine_cash_web_url:
        description: "HTTPS URL of deployed routine_cash_app web app"
        required: false
        default: "https://routine-cash-app.vercel.app/"
        type: string
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Install dependencies
        run: npm ci

      - name: Resolve ROUTINE_CASH_WEB_URL
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.routine_cash_web_url }}" ]; then
            echo "ROUTINE_CASH_WEB_URL=${{ github.event.inputs.routine_cash_web_url }}" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.ROUTINE_CASH_WEB_URL }}" ]; then
            echo "ROUTINE_CASH_WEB_URL=${{ vars.ROUTINE_CASH_WEB_URL }}" >> "$GITHUB_ENV"
          else
            echo "ROUTINE_CASH_WEB_URL=https://routine-cash-app.vercel.app/" >> "$GITHUB_ENV"
          fi

      - name: Validate URL
        shell: bash
        run: |
          case "$ROUTINE_CASH_WEB_URL" in
            https://*) echo "Using $ROUTINE_CASH_WEB_URL" ;;
            *) echo "ROUTINE_CASH_WEB_URL must start with https://" && exit 1 ;;
          esac

      - name: Validate signing secrets
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)

      - name: Decode keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Remote smoke check
        run: npm run smoke:pre-apk

      - name: Sync Capacitor Android
        run: npm run cap:sync

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: routine-cash-app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
