<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>루틴캐시</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          "Noto Sans KR",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          radial-gradient(circle at top, #e7f4ef 0%, #f5f1e8 52%, #efe8dc 100%);
        color: #173127;
      }
      .box {
        width: min(280px, calc(100vw - 40px));
        padding: 28px 24px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 48px rgba(19, 123, 97, 0.16);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 12px;
        border-radius: 999px;
        background: #d8f0e7;
        color: #137b61;
        font-size: 12px;
        font-weight: 700;
      }
      .title {
        margin-top: 14px;
        font-size: 22px;
        font-weight: 800;
      }
      .desc {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.55;
        color: rgba(23, 49, 39, 0.78);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="badge">루틴캐시 APK</div>
      <div class="title">앱을 불러오는 중입니다.</div>
      <div class="desc">
        배포된 루틴캐시 웹앱을 안전한 HTTPS WebView로 연결하고 있습니다.
      </div>
    </div>
  </body>
</html>
